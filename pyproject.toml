[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec"
version = "2.0.0"
description = "Real-time face recognition and attendance (OpenCV YuNet + SFace)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mukesh Kumar" }]
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
facerec = "facerec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
